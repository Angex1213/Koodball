<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOOD CITY — Open World</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101923;color:#fff;font:14px Arial}canvas{display:block}
#hud{position:fixed;top:14px;left:14px;padding:12px 15px;background:#07121ddd;border:1px solid #36aaff;border-radius:12px;z-index:2;min-width:190px}
#hud h2{margin:0 0 5px;color:#50c2ff;letter-spacing:2px}#place{color:#ffe18a;margin-top:8px}
#help{position:fixed;bottom:12px;left:12px;padding:10px 13px;background:#07121ddd;border-radius:10px;line-height:1.65;font-size:12px;z-index:2}
#speed{position:fixed;right:14px;bottom:14px;background:#07121ddd;border:1px solid #36aaff;border-radius:10px;padding:12px;font-size:18px;z-index:2}
#mode{position:fixed;right:14px;top:14px;background:#07121ddd;padding:10px 13px;border-radius:10px;color:#75d5ff;z-index:2}
#tip{position:fixed;top:75px;left:14px;color:#d8eaff;background:#07121daa;padding:7px 10px;border-radius:8px;z-index:2}
</style></head><body>
<div id="hud"><h2>KOOD CITY</h2><small>EL SALVADOR • OPEN WORLD PROTOTYPE</small><div id="place">SOYAPANGO</div></div>
<div id="mode">A PIE</div><div id="tip">Explora la ciudad y busca tu coche azul</div>
<div id="help"><b>CONTROLES</b><br>WASD / FLECHAS: moverte o conducir<br>E: entrar / salir del coche<br>SHIFT: correr<br>ESPACIO: freno de mano</div><div id="speed">0 km/h</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8e5);scene.fog=new THREE.Fog(0x9bc8e5,180,850);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1400);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf7ff,0x526044,2));
const sun=new THREE.DirectionalLight(0xffe4c0,2.5);sun.position.set(-100,180,100);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),mat(0x547b4a));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x30343a),lineMat=new THREE.MeshBasicMaterial({color:0xe8d99c});
function road(x,z,w,d){let q=new THREE.Mesh(new THREE.PlaneGeometry(w,d),roadMat);q.rotation.x=-Math.PI/2;q.position.set(x,.035,z);scene.add(q);let stripe=new THREE.Mesh(new THREE.PlaneGeometry(Math.min(1,w*.04),d*.92),lineMat);stripe.rotation.x=-Math.PI/2;stripe.position.set(x,.06,z);scene.add(stripe)}
// Barrio urbano con avenidas y manzanas
for(let i=-4;i<=4;i++){road(i*100,0,18,900);road(0,i*100,900,18)}
const colors=[0xc9bba6,0xaab7bd,0xd5cdbd,0x9b9d9a,0xc4a98e,0x8c9da5];
for(let x=-390;x<=390;x+=50)for(let z=-390;z<=390;z+=50){
 if(Math.abs(x%100)<22||Math.abs(z%100)<22)continue;
 const h=10+Math.random()*35,w=22+Math.random()*14,d=22+Math.random()*14;
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(colors[Math.floor(Math.random()*colors.length)]));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.5,.7,d+.5),mat(0x555b60));roof.position.set(x,h+.25,z);scene.add(roof);
 // ventanas sencillas
 const glass=mat(0x47788c,.35,.15);
 for(let yy=4;yy<h-2;yy+=6)for(let xx=-w/2+4;xx<w/2-2;xx+=6){let win=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.4,.12),glass);win.position.set(x+xx,yy,z-d/2-.08);scene.add(win)}
}
// palmeras
function palm(x,z){let t=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,8,7),mat(0x765034));t.position.set(x,4,z);scene.add(t);for(let i=0;i<6;i++){let f=new THREE.Mesh(new THREE.ConeGeometry(1.1,7,6),mat(0x247347));f.position.set(x+Math.cos(i)*2,8,z+Math.sin(i)*2);f.rotation.z=Math.PI/2;f.rotation.y=i;scene.add(f)}}
for(let i=-8;i<=8;i++)for(let j=-8;j<=8;j++)if(Math.abs(i%2)===0)palm(i*48+18,j*48+18);
// edificios reconocibles
function sign(txt,x,z){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='#092033';g.fillRect(0,0,512,128);g.fillStyle='#ffe28a';g.font='bold 44px Arial';g.textAlign='center';g.fillText(txt,256,80);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.position.set(x,23,z);s.scale.set(52,13,1);scene.add(s)}
sign('SOYAPANGO',0,-25);sign('PLAZA MUNDO',120,120);
const mall=new THREE.Mesh(new THREE.BoxGeometry(72,18,48),mat(0xd6d0c5));mall.position.set(120,9,150);mall.castShadow=true;scene.add(mall);
// personaje original low-poly detallado
const player=new THREE.Group();scene.add(player);
const skin=mat(0xb97850),shirt=mat(0x111827),pants=mat(0x202a38),shoe=mat(0x090b10),hair=mat(0x17120f);
function part(parent,geo,material,x,y,z){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
part(player,new THREE.CylinderGeometry(.42,.48,1.05,10),shirt,0,1.35,0);
part(player,new THREE.SphereGeometry(.36,12,10),skin,0,2.12,0);
part(player,new THREE.SphereGeometry(.37,12,8),hair,0,2.35,-.02);
const arms=[],legs=[];
for(const side of [-1,1]){arms.push(part(player,new THREE.CapsuleGeometry(.13,.68,4,8),shirt,side*.57,1.43,0));legs.push(part(player,new THREE.CapsuleGeometry(.17,.68,4,8),pants,side*.23,.55,0));part(player,new THREE.BoxGeometry(.3,.16,.48),shoe,side*.23,.12,.1)}
player.position.set(0,0,0);
// coche deportivo propio
const car=new THREE.Group();scene.add(car);
part(car,new THREE.BoxGeometry(3.6,1.05,6.2),new THREE.MeshStandardMaterial({color:0x0878e8,metalness:.65,roughness:.24}),0,1,0);
part(car,new THREE.BoxGeometry(2.8,1.15,3.1),mat(0x23475b,.22,.25),0,2,.1);
const wheels=[];for(const x of [-1.9,1.9])for(const z of [-2,2]){let w=part(car,new THREE.CylinderGeometry(.62,.62,.42,20),mat(0x101114),x,.62,z);w.rotation.z=Math.PI/2;wheels.push(w)}
for(const x of [-1.1,1.1]){part(car,new THREE.BoxGeometry(.65,.22,.08),mat(0xfff0c4,.25),x,1.15,3.12);part(car,new THREE.BoxGeometry(.65,.22,.08),mat(0xff2a18,.3),x,1.15,-3.12)}
car.position.set(8,0,10);
// autos decorativos estacionados
for(let i=0;i<14;i++){let c=new THREE.Group();let body=part(c,new THREE.BoxGeometry(3,1,5),mat([0xb52b25,0xeeeeee,0x222a35,0x9b9b9b][i%4],.3,.4),0,.8,0);part(c,new THREE.BoxGeometry(2.4,.9,2.5),mat(0x345366,.25,.2),0,1.65,0);c.position.set((i%7)*100-300,0,Math.floor(i/7)*170-100);c.rotation.y=Math.PI/2;scene.add(c)}
let driving=false,velocity=0,carAngle=0,playerAngle=0;const keys={};let last=performance.now();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault();if(e.key.toLowerCase()==='e')toggleCar()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function toggleCar(){if(!driving&&player.position.distanceTo(car.position)<7){driving=true;player.visible=false;document.getElementById('mode').textContent='CONDUCIENDO';document.getElementById('tip').textContent='E para salir del vehículo'}else if(driving){driving=false;player.visible=true;player.position.set(car.position.x+4,0,car.position.z);playerAngle=carAngle;document.getElementById('mode').textContent='A PIE';document.getElementById('tip').textContent='Explora la ciudad y busca tu coche azul'}}
function nearestName(){let x=player.position.x,z=player.position.z;if(driving){x=car.position.x;z=car.position.z}if(Math.abs(x)<160&&Math.abs(z)<160)return 'SOYAPANGO';if(Math.abs(x-120)<100&&Math.abs(z-120)<100)return 'PLAZA MUNDO';return 'SAN SALVADOR'}
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;
if(driving){if(keys.w||keys.arrowup)velocity+=25*dt;if(keys.s||keys.arrowdown)velocity-=30*dt;velocity=Math.max(-18,Math.min(55,velocity));if(keys[' '])velocity*=Math.pow(.02,dt);velocity*=Math.pow(.985,dt*60);let turn=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);if(Math.abs(velocity)>.5)carAngle+=turn*dt*1.65*Math.sign(velocity);car.rotation.y=carAngle;car.position.x-=Math.sin(carAngle)*velocity*dt;car.position.z-=Math.cos(carAngle)*velocity*dt;wheels.forEach(w=>w.rotation.x+=velocity*dt);
}else{let forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);let speed=keys.shift?12:7;let moving=Math.hypot(forward,side);if(moving){playerAngle=Math.atan2(side,forward);let dx=Math.sin(playerAngle)*speed*dt,dz=-Math.cos(playerAngle)*speed*dt;player.position.x+=dx;player.position.z+=dz;legs.forEach((l,i)=>l.rotation.x=Math.sin(now*.012+i*Math.PI)*.55);arms.forEach((a,i)=>a.rotation.x=-Math.sin(now*.012+i*Math.PI)*.35)}player.rotation.y=playerAngle;velocity=0}
const focus=driving?car:player;let ang=driving?carAngle:playerAngle;let desired=new THREE.Vector3(focus.position.x+Math.sin(ang)*12,driving?7:6,focus.position.z+Math.cos(ang)*12);camera.position.lerp(desired,1-Math.pow(.002,dt));camera.lookAt(focus.position.x,driving?1.5:1.4,focus.position.z);
document.getElementById('place').textContent=nearestName();document.getElementById('speed').textContent=Math.round(Math.abs(velocity)*3.6)+' km/h';renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
