
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOOD CITY - El Salvador</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
canvas{display:block}
#hud{
 position:fixed;top:14px;left:14px;z-index:5;
 background:#07121de8;border:1px solid #269bff;
 border-radius:12px;padding:13px;min-width:190px;
}
#hud h2{margin:0 0 8px;color:#39b5ff}
#hud small{color:#9bbbd0}
#location{margin-top:8px;color:#ffe27b}
#help{
 position:fixed;bottom:12px;left:12px;z-index:5;
 background:#07121de8;padding:12px;border-radius:10px;
 font-size:12px;line-height:1.7
}
#tag{
 position:fixed;right:12px;top:12px;
 background:#07121de8;padding:12px;border-radius:10px;
 color:#55caff;font-size:12px
}
#speed{
 position:fixed;right:12px;bottom:12px;
 background:#07121de8;padding:12px;border-radius:10px;
 font-size:18px
}
</style>
</head>
<body>

<div id="hud">
<h2>🇸🇻 KOOD CITY</h2>
<small>EL SALVADOR OPEN WORLD</small>
<div id="location">SOYAPANGO</div>
</div>

<div id="tag">3D WORLD · V1</div>

<div id="help">
<b>CONTROLES</b><br>
W / ↑ : Acelerar<br>
S / ↓ : Retroceder<br>
A / ← : Girar izquierda<br>
D / → : Girar derecha<br>
ESPACIO : Frenar
</div>

<div id="speed">0 km/h</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c4e2);
scene.fog=new THREE.Fog(0x91c4e2,350,1800);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,2500
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

// LUCES
scene.add(new THREE.HemisphereLight(0xe5f3ff,0x526044,2));

const sun=new THREE.DirectionalLight(0xffedcf,3);
sun.position.set(-200,300,150);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// MATERIALES
const material=(color,roughness=.9,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

// TERRENO
const terrain=new THREE.Mesh(
 new THREE.PlaneGeometry(2400,2400),
 material(0x557c48)
);
terrain.rotation.x=-Math.PI/2;
terrain.receiveShadow=true;
scene.add(terrain);

// MONTAÑAS
for(let i=0;i<22;i++){
 const h=100+Math.random()*170;
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(65+Math.random()*70,h,8),
  material(i%2?0x557c52:0x70836a)
 );
 mountain.position.set(
  (Math.random()-.5)*1900,h/2-15,
  (Math.random()-.5)*1900
 );
 scene.add(mountain);
}

// UBICACIONES APROXIMADAS
// Coordenadas geográficas convertidas a kilómetros.
// No representan todavía un trazado vial oficial.

const places = [
 {name:"SOYAPANGO",lat:13.710,lon:-89.139},
 {name:"PLAZA MUNDO",lat:13.710,lon:-89.140},
 {name:"SAN SALVADOR",lat:13.693,lon:-89.219},
 {name:"SANTA TECLA",lat:13.677,lon:-89.280},
 {name:"APOPA",lat:13.807,lon:-89.179},
 {name:"ILOPANGO",lat:13.701,lon:-89.109},
 {name:"SANTA ANA",lat:13.994,lon:-89.560},
 {name:"AHUACHAPAN",lat:13.921,lon:-89.845},
 {name:"SONSONATE",lat:13.719,lon:-89.724},
 {name:"CHALATENANGO",lat:14.078,lon:-89.094},
 {name:"LA PALMA",lat:14.317,lon:-89.170},
 {name:"SUCHITOTO",lat:13.938,lon:-89.027},
 {name:"COJUTEPEQUE",lat:13.719,lon:-88.933},
 {name:"ILOBASCO",lat:13.840,lon:-88.630},
 {name:"SAN VICENTE",lat:13.641,lon:-88.785},
 {name:"APASTEPEQUE",lat:13.663,lon:-88.750},
 {name:"ZACATECOLUCA",lat:13.508,lon:-88.868},
 {name:"USULUTAN",lat:13.346,lon:-88.438},
 {name:"SAN MIGUEL",lat:13.483,lon:-88.177},
 {name:"LA UNION",lat:13.337,lon:-87.844}
];

const baseLat=places[0].lat;
const baseLon=places[0].lon;

function position(p){
 return new THREE.Vector3(
  (p.lon-baseLon)*108*1000*Math.cos(baseLat*Math.PI/180)/1000,
  0,
  -(p.lat-baseLat)*111
 );
}

// ESCALA VISUAL: se comprime el territorio para poder jugar.
// Mantiene el orden y la dirección aproximada de las localidades.
const SCALE=.42;
function world(p){
 const v=position(p);
 return new THREE.Vector3(v.x*SCALE,0,v.z*SCALE);
}

const locations=places.map(p=>({
 ...p,pos:world(p)
}));

// CARRETERAS
function road(a,b,width=13,color=0x30343a){
 const direction=new THREE.Vector3().subVectors(b,a);
 const length=direction.length();
 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(width,length),
  material(color)
 );
 mesh.rotation.x=-Math.PI/2;
 mesh.rotation.z=-Math.atan2(direction.x,direction.z);
 mesh.position.copy(a).add(b).multiplyScalar(.5);
 mesh.position.y=.025;
 scene.add(mesh);
}

// CARRETERA PRINCIPAL
for(let i=0;i<locations.length-1;i++){
 road(locations[i].pos,locations[i+1].pos,15);
}

// LINEAS VIALES
function roadLine(a,b){
 const direction=new THREE.Vector3().subVectors(b,a);
 const length=direction.length();
 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(.5,length),
  new THREE.MeshBasicMaterial({color:0xf0dfa0})
 );
 mesh.rotation.x=-Math.PI/2;
 mesh.rotation.z=-Math.atan2(direction.x,direction.z);
 mesh.position.copy(a).add(b).multiplyScalar(.5);
 mesh.position.y=.06;
 scene.add(mesh);
}
for(let i=0;i<locations.length-1;i++){
 roadLine(locations[i].pos,locations[i+1].pos);
}

// CALLES DE CADA LOCALIDAD
for(const place of locations){
 for(let j=-3;j<=3;j++){
  const r1=new THREE.Mesh(
   new THREE.PlaneGeometry(9,190),
   material(0x414449)
  );
  r1.rotation.x=-Math.PI/2;
  r1.position.set(place.pos.x+j*27,.035,place.pos.z);
  scene.add(r1);

  const r2=new THREE.Mesh(
   new THREE.PlaneGeometry(190,9),
   material(0x414449)
  );
  r2.rotation.x=-Math.PI/2;
  r2.position.set(place.pos.x,.035,place.pos.z+j*27);
  scene.add(r2);
 }
}

// EDIFICIOS
const buildingColors=[
 0xc4b9a6,0x9ba4a9,0xd4c9b5,
 0x858c93,0xb0a99c,0xc4c4b9
];

function building(x,z,h,w,d){
 const b=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material(buildingColors[Math.floor(Math.random()*buildingColors.length)])
 );
 b.position.set(x,h/2,z);
 b.castShadow=true;
 b.receiveShadow=true;
 scene.add(b);

 // Ventanas
 for(let y=4;y<h-2;y+=6){
  for(let wx=-w/2+4;wx<w/2-2;wx+=6){
   const win=new THREE.Mesh(
    new THREE.BoxGeometry(2.5,2.5,.12),
    material(0x538398,.3,.2)
   );
   win.position.set(x+wx,y,z-d/2-.08);
   scene.add(win);
  }
 }
}

// Centros urbanos y pueblos
for(let index=0;index<locations.length;index++){
 const center=locations[index].pos;
 const count=index===1||index===2?100:55;

 for(let i=0;i<count;i++){
  const x=center.x+(Math.random()-.5)*210;
  const z=center.z+(Math.random()-.5)*210;

  if(Math.abs(x-center.x)<17||
     Math.abs(z-center.z)<17)continue;

  const h=9+Math.random()*40;
  building(x,z,h,12+Math.random()*12,12+Math.random()*12);
 }
}

// PLAZA MUNDO
const plaza=locations[1].pos;
const mall=new THREE.Mesh(
 new THREE.BoxGeometry(65,17,50),
 material(0xe1d8c9)
);
mall.position.set(plaza.x,8.5,plaza.z+48);
mall.castShadow=true;
scene.add(mall);

// LETRERO PLAZA MUNDO
function label(text,pos,color="#ffffff"){
 const canvas=document.createElement("canvas");
 canvas.width=512;
 canvas.height=128;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="rgba(5,15,25,.85)";
 ctx.fillRect(0,0,512,128);
 ctx.fillStyle=color;
 ctx.font="bold 38px Arial";
 ctx.textAlign="center";
 ctx.fillText(text,256,79);
 const tex=new THREE.CanvasTexture(canvas);
 const sprite=new THREE.Sprite(
  new THREE.SpriteMaterial({map:tex,transparent:true})
 );
 sprite.position.set(pos.x,22,pos.z);
 sprite.scale.set(65,16,1);
 scene.add(sprite);
}

for(const place of locations){
 label(place.name,place.pos,
  place.name==="PLAZA MUNDO"?"#ffe17a":"#ffffff");
}
label("PLAZA MUNDO",new THREE.Vector3(plaza.x,0,plaza.z+48),"#ffe17a");

// PALMERAS
function palm(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.3,.55,9,8),
  material(0x795332)
 );
 trunk.position.set(x,4.5,z);
 scene.add(trunk);

 for(let i=0;i<7;i++){
  const leaf=new THREE.Mesh(
   new THREE.ConeGeometry(1.1,7,6),
   material(0x236e40)
  );
  leaf.position.set(
   x+Math.cos(i*Math.PI/3.5)*2,
   9,
   z+Math.sin(i*Math.PI/3.5)*2
  );
  leaf.rotation.z=Math.PI/2;
  leaf.rotation.y=i*Math.PI/3.5;
  scene.add(leaf);
 }
}
for(const p of locations){
 for(let i=-4;i<=4;i++){
  palm(p.pos.x+i*20,p.pos.z+100);
 }
}

// VEHÍCULO
const car=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.BoxGeometry(3.5,1.15,6),
 new THREE.MeshStandardMaterial({
  color:0x086bdb,metalness:.65,roughness:.25
 })
);
body.position.y=1;
body.castShadow=true;
car.add(body);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(2.8,1.2,3),
 material(0x203b4e,.2,.3)
);
cabin.position.set(0,2,.15);
car.add(cabin);

const wheels=[];
for(const x of [-1.9,1.9]){
 for(const z of [-1.9,1.9]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.65,.65,.4,24),
   material(0x111111)
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.65,z);
  car.add(wheel);
  wheels.push(wheel);
 }
}
scene.add(car);
car.position.copy(locations[0].pos);
car.position.y=0;

// PUNTO DE DESTINO
const destination=new THREE.Mesh(
 new THREE.TorusGeometry(7,.6,12,40),
 new THREE.MeshBasicMaterial({color:0xffdf33})
);
destination.rotation.x=Math.PI/2;
destination.position.copy(locations[4].pos);
destination.position.y=1;
scene.add(destination);

// CONTROLES
const keys={};
window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space")e.preventDefault();
});
window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

// CONDUCCIÓN
let velocity=0;
let angle=0;
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(keys.w||keys.arrowup)velocity+=22*dt;
 if(keys.s||keys.arrowdown)velocity-=24*dt;
 if(keys[" "])velocity*=Math.pow(.015,dt);

 velocity=Math.max(-16,Math.min(48,velocity));
 velocity*=Math.pow(.985,dt*60);

 if(Math.abs(velocity)>.5){
  const turn=(keys.a||keys.arrowleft?1:0)-
             (keys.d||keys.arrowright?1:0);
  angle+=turn*dt*1.8*Math.sign(velocity);
 }

 car.rotation.y=angle;
 car.position.x-=Math.sin(angle)*velocity*dt;
 car.position.z-=Math.cos(angle)*velocity*dt;

 for(const wheel of wheels){
  wheel.rotation.x+=velocity*dt;
 }

 // CÁMARA
 const offset=new THREE.Vector3(
  Math.sin(angle)*17,9,
  Math.cos(angle)*17
 );
 const target=car.position.clone().add(offset);
 camera.position.lerp(target,1-Math.pow(.002,dt));
 camera.lookAt(car.position.x,2,car.position.z);

 // LOCALIDAD MÁS CERCANA
 let closest=locations[0];
 let min=Infinity;
 for(const p of locations){
  const d=car.position.distanceTo(p.pos);
  if(d<min){min=d;closest=p;}
 }
 document.getElementById("location").textContent=closest.name;
 document.getElementById("speed").textContent=
 Math.round(Math.abs(velocity)*4)+" km/h";

 destination.rotation.z+=dt;
 renderer.render(scene,camera);
}

camera.position.set(0,10,20);
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
